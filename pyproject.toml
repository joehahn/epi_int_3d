[project]
name = "epi-int-3d"
version = "0.1.0"
license = "PolyForm-Noncommercial-1.0.0"
description = "3D streamline N-body integrator for planetary rings, extending epi_int_lite"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numba>=0.68.0",
    "numpy",
    "scipy",
    "sympy",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "line-profiler>=5.0.2",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
