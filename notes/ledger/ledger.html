<title>epi_int_3d paper ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: the paper as a stack of section cards in one reading column, each with its issues and a note
   box at its foot; a sticky bar with the totals and the Apply button; a section index on the right. */
:root {
  --bg: #f3f4f6; --paper: #ffffff; --ink: #18202b; --ink-2: #485365; --ink-3: #747e8f;
  --rule: #dde1e7; --rule-2: #c6ccd6; --accent: #1d5c74; --accent-soft: #e2eef2;
  --warn: #9b5b00; --warn-soft: #fbf0dc; --ok: #2a7548; --ok-soft: #e3f2e9; --bad: #b0303a; --bad-soft: #fae8e9;
  --f-text: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111419; --paper: #1a1e25; --ink: #e5e8ed; --ink-2: #b2b9c6; --ink-3: #8a93a3;
  --rule: #2a303b; --rule-2: #3a414e; --accent: #7cc0d6; --accent-soft: #1d3540;
  --warn: #e3b25e; --warn-soft: #382c17; --ok: #7cc79a; --ok-soft: #1b3125; --bad: #ee8890; --bad-soft: #3a1e22;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111419; --paper: #1a1e25; --ink: #e5e8ed; --ink-2: #b2b9c6; --ink-3: #8a93a3;
  --rule: #2a303b; --rule-2: #3a414e; --accent: #7cc0d6; --accent-soft: #1d3540;
  --warn: #e3b25e; --warn-soft: #382c17; --ok: #7cc79a; --ok-soft: #1b3125; --bad: #ee8890; --bad-soft: #3a1e22;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 840px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
.top .wrap { padding-block: 12px 10px; display: grid; gap: 8px; }
.titlerow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
h1 { font-family: var(--f-text); font-weight: 600; font-size: 20px; margin: 0; text-wrap: balance; }
h1 code { font-family: var(--f-mono); font-size: 17px; font-weight: 500; }
.sub { color: var(--ink-3); font-size: 12.5px; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 12.5px; color: var(--ink-2); }
.stat b { font-family: var(--f-mono); font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.bar { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.chip { font: 500 12px var(--f-ui); border: 1px solid var(--rule-2); background: var(--paper); color: var(--ink-2); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip .n { font-family: var(--f-mono); margin-left: 4px; opacity: .8; }
.apply { font: 600 12.5px var(--f-ui); background: var(--accent); color: var(--paper); border: 0; border-radius: 6px; padding: 5px 14px; cursor: pointer; }
.apply:disabled { opacity: .55; cursor: default; }
.applymsg { font-size: 12px; color: var(--ink-2); max-width: 60ch; }
.banner { font: 500 13px var(--f-ui); background: var(--ok-soft); color: var(--ok); border-radius: 6px; padding: 8px 12px; }
.banner.working { background: var(--accent-soft); color: var(--accent); }
.banner.working::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: currentColor; margin-right: 8px; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }

main .wrap { padding-block: 18px 90px; display: grid; gap: 14px; }
.sechead { font: 600 11.5px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 16px 0 -2px; display: flex; gap: 10px; align-items: center; scroll-margin-top: 150px; }
.sechead::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.notice { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 16px; color: var(--ink-2); }

.card { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 16px 18px 14px; display: grid; gap: 12px; min-width: 0; scroll-margin-top: 150px; }
.card[data-state="attention"] { box-shadow: inset 4px 0 0 var(--warn); }
.cardhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.cardhead h2 { font-family: var(--f-text); font-weight: 600; font-size: 19px; margin: 0; text-wrap: balance; }
.cardhead h2 .num { font-family: var(--f-mono); font-weight: 500; font-size: 15px; color: var(--ink-3); margin-right: 8px; }
.cardhead code { font-family: var(--f-mono); font-size: .88em; }
.pill { font: 600 11px var(--f-ui); padding: 1px 8px; border-radius: 999px; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.attention { background: var(--warn-soft); color: var(--warn); }
.facts { font-size: 12px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 2px 14px; }
.facts b { font-family: var(--f-mono); font-weight: 500; color: var(--ink-2); }

.text { font-family: var(--f-text); font-size: 16px; line-height: 1.62; color: var(--ink); max-width: 70ch; overflow-wrap: break-word; min-width: 0; }
.text p { margin: 0; } .text p + p, .text .pnote + p { text-indent: 1.5em; }
.text .pnote { margin: 0 0 4px; text-indent: 0; }
.text .pnote.open { margin: 6px 0 12px; padding: 6px 0 0 12px; border-left: 3px solid var(--rule-2); }
.text .pnote > button.pbtn { font: 12px var(--f-ui); color: var(--ink-3); background: none; border: 0; padding: 0; cursor: pointer; }
.text .pnote > button.pbtn:hover { color: var(--accent); text-decoration: underline; }
.text a.ref { color: inherit; text-decoration: underline dotted; text-underline-offset: 2px; } .text a.ref:hover { text-decoration-style: solid; }
.text .nb { margin-top: .8em; font: 13.5px var(--f-ui); color: var(--ink-2); } .text .nb a { overflow-wrap: anywhere; }
.text h4.sub { font: italic 15px var(--f-text); color: var(--ink-2); margin: .9em 0 .3em; }
.text code { font-family: var(--f-mono); font-size: .86em; }
.text ol { margin: .3em 0 .7em; padding-left: 1.4em; }
.text .eq { display: block; margin: .5em 0; overflow-x: auto; overflow-y: hidden; }
.text .fn { display: block; font-size: 13.5px; color: var(--ink-2); border-left: 2px solid var(--rule-2); padding-left: 10px; margin: .4em 0; }
.text .fn::before { content: "Footnote. "; font: 600 11px var(--f-ui); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
.text .fn a { overflow-wrap: anywhere; }
.fig { margin: .8em 0; display: grid; gap: 6px; }
.fig img { width: 100%; max-width: 640px; height: auto; border-radius: 4px; background: #fff; }
.fig figcaption { font-size: 14px; line-height: 1.5; color: var(--ink-2); }
.fig .missing { font: 12.5px var(--f-ui); color: var(--ink-3); border: 1px dashed var(--rule-2); border-radius: 4px; padding: 18px; text-align: center; }
mjx-container { color: var(--ink); }
mjx-container[display="true"] { margin: .4em 0 !important; }

.issues { display: grid; gap: 8px; border-top: 1px dashed var(--rule); padding-top: 10px; }
.issuebar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font: 600 12.5px var(--f-ui); color: var(--ink-2); }
.recbtn { font: 600 12px var(--f-ui); background: var(--paper); color: var(--accent); border: 1px solid var(--accent); border-radius: 6px; padding: 2px 10px; cursor: pointer; }
.issue { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: baseline; }
.issue.skipped .itext { color: var(--ink-3); text-decoration: line-through; }
.ik { font: 600 10.5px var(--f-ui); text-transform: uppercase; letter-spacing: .05em; color: var(--warn); min-width: 48px; }
.ik.review { color: var(--bad); }
.itext { min-width: 0; overflow-wrap: anywhere; }
.itext .star { color: var(--warn); }
.idetail { grid-column: 2 / 4; font-size: 12.5px; color: var(--ink-2); }
.seg { display: inline-flex; border: 1px solid var(--rule-2); border-radius: 6px; overflow: hidden; }
.seg button { font: 500 11.5px var(--f-ui); background: var(--paper); color: var(--ink-2); border: 0; padding: 2px 9px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule-2); }
.seg button[data-v="use"][aria-pressed="true"] { background: var(--ok); color: var(--paper); }
.seg button[data-v="skip"][aria-pressed="true"] { background: var(--ink-3); color: var(--paper); }
@media (max-width: 520px) { .issue { grid-template-columns: 1fr auto; } .ik { grid-column: 1 / 3; } .idetail { grid-column: 1 / 3; } }

.note { display: grid; gap: 4px; border-top: 1px dashed var(--rule); padding-top: 10px; }
.note label { font: 600 12px var(--f-ui); color: var(--ink-2); }
.note textarea { font: 14px/1.5 var(--f-ui); color: var(--ink); background: var(--bg); border: 1px solid var(--rule-2); border-radius: 6px; padding: 8px 10px; min-height: 44px; resize: vertical; width: 100%; }
.note textarea:focus { background: var(--paper); }
.notestatus { font-size: 11.5px; color: var(--ink-3); min-height: 1em; }
.reply { font-size: 13px; color: var(--ink); background: var(--accent-soft); border-radius: 6px; padding: 6px 10px; }
.reply b { color: var(--accent); }
.reply summary { cursor: pointer; font-size: 12.5px; }
.reply .replytext { margin-top: 4px; white-space: pre-wrap; }
.reply.stale { background: var(--bg); color: var(--ink-2); }
.reply.stale b { color: var(--ink-2); }

.costs { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 16px 18px; display: grid; gap: 14px; min-width: 0; }
.costs h2 { font-family: var(--f-text); font-weight: 600; font-size: 19px; margin: 0; }
.costs h3 { font: 600 11.5px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 4px 0 0; }
.tot { display: flex; flex-wrap: wrap; gap: 10px 26px; }
.tot div { display: grid; }
.tot b { font: 500 20px var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.tot span { font-size: 12px; color: var(--ink-3); max-width: 22ch; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 480px; }
th { text-align: left; font: 600 11px var(--f-ui); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); border-bottom: 1px solid var(--rule-2); padding: 6px 8px; }
th.r, td.r { text-align: right; }
td { border-bottom: 1px solid var(--rule); padding: 6px 8px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
td.r { font-family: var(--f-mono); color: var(--ink); }
.foot { color: var(--ink-3); font-size: 12px; max-width: 70ch; }

.nav { position: fixed; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 150px); right: max(16px, env(safe-area-inset-right, 0px));
  width: 220px; max-height: calc(100vh - 180px); overflow-y: auto; background: var(--paper); border: 1px solid var(--rule);
  border-radius: 6px; padding: 8px 0; display: grid; font-size: 12.5px; }
.nav a { display: flex; gap: 8px; padding: 3px 12px; color: var(--ink-2); text-decoration: none; border-left: 2px solid transparent; }
.nav a .k { font: 500 11px var(--f-mono); color: var(--ink-3); min-width: 26px; }
.nav a .w { margin-left: auto; font: 600 11px var(--f-mono); color: var(--warn); }
.nav a.sub2 { padding-left: 22px; }
.nav a:hover { background: var(--bg); color: var(--ink); }
.nav a[aria-current="true"] { color: var(--ink); border-left-color: var(--accent); font-weight: 600; }
.nav hr { border: 0; border-top: 1px solid var(--rule); margin: 6px 0; }
.navbtn { position: fixed; z-index: 7; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  font: 600 13px var(--f-ui); background: var(--ink); color: var(--paper); border: 0; border-radius: 999px; padding: 10px 16px; cursor: pointer; display: none; }
@media (max-width: 1379px) {
  .navbtn { display: block; }
  .nav { top: auto; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); width: min(280px, calc(100vw - 32px)); box-shadow: 0 6px 24px rgb(0 0 0 / .18); }
  .nav:not(.open) { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
  mjx-container[data-tex] { cursor: copy; border-radius: 3px; }
  mjx-container[data-tex]:hover { background: var(--accent-soft); }
  .toast { position: fixed; z-index: 9; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    max-width: min(640px, calc(100vw - 32px)); font: 500 13px var(--f-ui); background: var(--ink); color: var(--paper);
    border-radius: 6px; padding: 8px 14px; box-shadow: 0 6px 24px rgb(0 0 0 / .18); white-space: pre-wrap; overflow-wrap: anywhere; }
  #MJX-SVG-global-cache, svg#MJX-SVG-global-cache { display: none !important; }
.text .subnote { margin: 12px 0 18px; border-top: 0; padding: 8px 0 0 12px; border-left: 3px solid var(--rule-2); text-indent: 0; }
.text .subnote label { font-weight: 500; }
</style>

<header class="top">
  <div class="wrap">
    <div class="titlerow">
      <h1><code>epi_int_3d</code> paper ledger</h1>
      <span class="sub" id="subline">Loading the paper…</span>
    </div>
    <div class="stats" id="stats" hidden></div>
    <div class="bar" id="bar" hidden></div>
    <div class="banner" id="banner" role="status" aria-live="polite" hidden></div>
  </div>
</header>

<nav class="nav" id="nav" aria-label="Sections"></nav>
<button class="navbtn" id="navbtn" aria-controls="nav" aria-expanded="false">Sections</button>

<main>
  <div class="wrap" id="list">
    <div class="notice" id="notice">Loading the paper. Each section will appear here as a card with its text, its open issues and a box for your notes to Claude.</div>
  </div>
</main>

<script>
  window.MathJax = {
    tex: { inlineMath: [["$", "$"]], displayMath: [], processEnvironments: true, tags: "none" },
    svg: { fontCache: "local" },

</script>

<script>
(() => {

  const filters = [["all", "All"], ["attention", "Has issues"], ["noted", "Has my note"]];
  const hasNote = id => { const n = state.notes[id] || {}; return !!(n.text || "").trim() || !!Object.keys(n.fixes || {}).length; };
  const match = (c, f) => f === "all" ? true : f === "attention" ? c.state === "attention"
    : hasNote(c.id) || Object.keys(state.notes).some(k => k.startsWith(c.id + "~") && hasNote(k));

  async function start() {
    const notice = $("#notice");
    const db = await window.claude?.use?.("db").catch(() => null);
    if (!db) { notice.textContent = "This view can't load the paper. Open the ledger on claude.ai while signed in."; return; }
    state.db = db;
    const timer = setTimeout(() => { if (!state.loaded) notice.textContent = "The paper can't be reached yet. It will appear here as soon as it loads."; }, 10000);
    db.collection("cards").orderBy("order").onSnapshot(snap => {
      state.cards = snap.docs.map(d => d.data());
      if (!snap.metadata?.fromCache) { state.loaded = true; clearTimeout(timer); }
      if (!state.cards.length) { notice.textContent = "No cards yet. Claude fills this page from the paper with tools/ledger.py."; return; }
      render();
    }, () => { clearTimeout(timer); notice.textContent = "The paper stopped loading. Reload the page to try again."; });
    db.doc("meta/summary").onSnapshot(s => { state.summary = s.exists ? s.data() : null; if (state.cards.length) renderTop(); }, () => {});
    db.doc("meta/costs").onSnapshot(s => { state.costs = s.exists ? s.data() : null; if (state.cards.length && location.hash === "#costs") renderCosts(); }, () => {});
    db.collection("notes").onSnapshot(snap => {
      for (const d of snap.docs) if (!writing[d.id]) state.notes[d.id] = d.data();
      if (state.cards.length) {
        for (const d of snap.docs) {
          const ta = document.getElementById(`note-${d.id}`);
          if (ta && document.activeElement !== ta && !writing[d.id]) ta.value = d.data().text || "";
          document.getElementById(`card-${d.id}`)?._issues?._fill();
        }
        renderTop();
      }
    }, () => {});
    db.collection("replies").onSnapshot(snap => {
      const before = state.replies;
      state.replies = Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
      if (state.cards.length && location.hash !== "#costs")
        for (const id of Object.keys(state.replies)) if (JSON.stringify(before[id]) !== JSON.stringify(state.replies[id]) && document.activeElement?.id !== `note-${id}`) redraw(id.split("~")[0]);
      if (state.working) {
        for (const [id, r] of Object.entries(state.replies)) if ((r.at || "") > state.working) state.updated.add(id);
        if (state.updated.size) {
          state.banner = `Done: Claude replied on ${plural(state.updated.size, "card")}. Read the replies under your notes.`;
          state.working = null;
          setTimeout(() => { if (!state.working) { state.banner = ""; renderTop(); } }, 30000);
        }
      }
      if (state.cards.length) renderTop();
    }, () => {});
  }
  window.addEventListener("hashchange", () => { if (state.cards.length) render(); });
  $("#navbtn").addEventListener("click", () => { const open = $("#nav").classList.toggle("open"); $("#navbtn").setAttribute("aria-expanded", String(open)); });
  start();
})();
</script>
